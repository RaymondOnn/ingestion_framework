

name: load_csv_to_postgres
timestamp_format: "%Y-%m-%d %H:%M:%S"
retries: 3
retry_delay_secs: 10
timeout_secs: 60
locations:
  source_folder:
    type: directory
    directory_path: examples/Loading csv into Postgres/data

  postgres:
    type: postgres
    user: postgres
    password: postgres
    server: postgresdb
    host: localhost
    port: 5432
    database: postgres
    schema: staging

steps:
  import:
    uses: files.import
    params:
      source: source_folder
      pattern:  "^.*?([0-9]{8}).*?(\\.csv)$"
      extensions:

  process:
    depends_on: import
    uses: database.copy
    params:
      target: postgres
      target_table: Product
      filename_date_pattern: "(?P<year>[0-9]{4})(?P<month>[0-9]{2})(?P<day>[0-9]{2})"
      file_format: csv
      partition_column: Invoice_Date
      schema:
        - source_name: InvoiceNo
          target_name: Invoice_No
          data_type: CHAR(6)
          sql_transformation: ""
          source_index: 1
          target_index: 1
        - source_name: StockCode
          target_name: Stock_Code
          data_type : varchar(10)
          sql_transformation: ""
          source_index: 2
          target_index: 2
        - source_name : Description
          target_name : Item_Desc
          data_type : varchar(100)
          sql_transformation: ""
          source_index: 3
          target_index: 3
        - source_name : Quantity
          target_name : Quantity
          data_type : integer
          sql_transformation: ""
          source_index: 4
          target_index: 4
        - source_name : InvoiceDate
          target_name : Invoice_Date
          data_type : timestamp
          sql_transformation: ""
          source_index: 5
          target_index: 5
        - source_name : UnitPrice
          target_name : Unit_Price
          data_type : DECIMAL(10,2)
          sql_transformation: ""
          source_index: 6
          target_index: 6
        - source_name: CustomerID
          target_name : Customer_ID
          data_type : char(6)
          sql_transformation : ""
          source_index: 7
          target_index: 7
        - source_name: Country
          target_name : Country
          data_type : varchar(50)
          sql_transformation : ""
          source_index: 8
          target_index: 8
