

name: test pipeline
timestamp_format: "%Y-%m-%d %H:%M:%S"
retries: 3
retry_delay_secs: 10
timeout_secs: 60
locations:
  source_folder:
    type: directory
    directory_path: examples/Loading csv into Postgres/data

  postgres:
    type: postgres
    user: postgres
    password: postgres
    server: postgresdb
    port: 5432
    database: postgres
    schema: staging

steps:
  import:
    uses: files.import
    params:
      source: source_folder

  process:
    depends_on: import
    uses: load_to_database
